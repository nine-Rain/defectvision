[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectvision"
version = "0.1.0"
description = "Train, evaluate and deploy a custom surface-defect detector."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# 训练 + 评估 + 导出
train = [
    "ultralytics>=8.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# 本地 Demo
demo = ["gradio>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
