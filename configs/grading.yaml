# 缺陷等级判定规则
#
# 严格对齐开题报告（2026-09-23）"缺陷等级判定方法研究"一节的定义：
#
#   I 级（轻微）：面积占比 ≤0.5%、数量 ≤2 且不含裂纹类缺陷 —— 合格，放行留档
#   II 级（中度）：面积 0.5%~2%，或数量 3~5，或存在非贯穿性短裂纹 —— 让步接收，返修后复检
#   III 级（严重）：面积 2%~5%，或数量 6~10，或裂纹长度超过限值 —— 不合格，返工并二次全检
#   IV 级（致命）：面积 >5%，或缺陷连片密集，或存在贯穿性裂纹 —— 判废，追溯同批次
#
# 判定原则：**就高不就低**。面积、数量、裂纹、连片四个判据各自给出等级，取最高者。
# 这样任何单一指标恶化都不会被其他指标"平均掉"，也便于向工艺人员解释。
#
# 说明：公开数据集里没有"裂纹"这个类别，用下面的 crack.classes 做映射。
# MSDD 只有划痕（scratch），NEU-DET 有龟裂（crazing）。换数据集时改这里即可。

levels:
  1:
    name: "I级 轻微"
    action: "合格，放行并留档备查"
  2:
    name: "II级 中度"
    action: "让步接收，打磨/补焊等简单返修后复检"
  3:
    name: "III级 严重"
    action: "不合格，返工处理并二次全检"
  4:
    name: "IV级 致命"
    action: "判废，追溯同批次产品与相关工序"

criteria:
  # 单个检测框面积超过图像该比例时，视为"整体框"（把整个零件框成一个缺陷的误检），
  # 不参与面积/数量统计。设 0 表示不过滤——**默认就是 0**。
  #
  # 复核 42 张误杀样本发现：81% 的案例里模型确实多输出了覆盖整件的大框。
  # 但按 0.40 过滤后，误杀降了、IV 召回却从 99.0% 崩到 64.3%
  # （YOLOv8s 93.9%→57.1%）——因为 MSDD 里真实的严重缺陷本身就是大面积。
  # 结论：这招不可用，保留开关供复现。
  max_det_area_ratio: 0

  # 面积口径：mask / box / auto
  #   mask —— 用分割掩码的像素面积（真实缺陷面积，跨模型稳定，推荐）
  #   box  —— 用检测框并集面积（会把背景一起算进去，框越松面积越大）
  #   auto —— 检测结果带掩码就用 mask，否则退回 box（默认）
  #
  # 为什么要管这个：实验发现同一套阈值，换输入分辨率（512→640）判级一致率会掉 8 个点，
  # 因为框变紧导致面积变小、等级被系统性低估。框面积不是物理量，掩码面积才是。
  area_source: auto

  # 面积是否按置信度加权：binary（默认）/ confidence
  #   binary     —— 二值并集：检出即算满面积。
  #   confidence —— 每个像素取"覆盖它的最高置信度"再累加（0.5 分的框只算半面积）。
  #
  # 实验结论：加权**没有用**，反而略有损失，所以默认关闭。
  # 三个模型 A/B（MSDD test）：YOLOv8s 83.3%→80.7%，RT-DETR 81.3%→78.0%，
  # 自研 CNN 73.3%→72.7%，而误杀率一个都没降。
  # 原因：撑大面积的是**高置信误检**（0.7~0.9），乘个系数掉不到阈值以下。
  # 保留这个开关是为了让后来的实验能复现这条负结果。
  area_weighting: binary

  # 缺陷覆盖面积占比阈值。用 mask 口径时，阈值应低于 box 口径（框比缺陷本身大）
  area_ratio:
    level2: 0.005    # >0.5%  判 II
    level3: 0.020    # >2%    判 III
    level4: 0.050    # >5%    判 IV

  # 缺陷数量
  count:
    level2: 3        # >=3  判 II
    level3: 6        # >=6  判 III
    level4: 11       # >=11 判 IV（即"超过 10 处"）

  # 裂纹类缺陷：长度按外接框长边 / 图像长边归一化
  # （不用对角线：轴对齐框的边长最多只到 0.707 倍对角线，阈值 0.8 会永远触发不了）
  crack:
    classes: ["crazing", "crack", "scratch"]   # 视为裂纹/线状缺陷的类别名
    length_level3_ratio: 0.30   # 超过图像长边的 30% -> III
    length_level4_ratio: 0.80   # 超过 80% -> 视为贯穿性 -> IV
    short_level2: true          # 存在裂纹但未超限 -> 至少 II

  # 连片密集：缺陷多且彼此靠得很近
  clustered:
    min_count: 4
    max_gap_ratio: 0.02         # 最近间距 < 2% 对角线即视为相邻

# 综合得分仅作展示，不参与定级（定级只看上面的判据）。
# 归一化上限用于把各特征压到 0~1。
score:
  weights:
    area: 0.40
    count: 0.25
    severity: 0.25
    spread: 0.10
  normalizers:
    area_ratio: 0.05
    count: 10
    spread: 0.50

# 缺陷类型严重度，仅用于综合得分展示与"最严重缺陷"的说明
class_severity:
  stain: 1
  scratch: 2
  dark_spot: 2
  porosity: 3
  oxidation: 3
  crazing: 3
  fold: 4
