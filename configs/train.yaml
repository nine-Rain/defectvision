# ---------------------------------------------------------------------------
# 训练配置。命令行参数可以覆盖这里的任何一项（见 python -m src.train --help）。
#
# 换任务只改两个字段：
#   检测  -> model: yolo11n.pt
#   分割  -> model: yolo11n-seg.pt   （数据集标签换成多边形格式）
# 换模型：n < s < m < l < x，越大越准也越慢，先用 n 把流程跑通。
# ---------------------------------------------------------------------------
model: yolo11n.pt
dataset: configs/dataset.yaml

epochs: 80
imgsz: 640
batch: 16
patience: 20        # 多少轮没提升就早停
seed: 42

device: auto        # auto | cpu | 0 | 0,1
workers: 4

project: runs
name: baseline
